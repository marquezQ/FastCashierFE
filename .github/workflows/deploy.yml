name: Deploy Frontend
on:
  push:
    branches: [develop]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy en VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # Aborta si cualquier comando falla (evita falsos éxitos)
            cd /var/www/fastcashier/frontend
            git fetch origin develop
            git reset --hard origin/develop  # Fuerza sincronización exacta con remoto
            npm install
            NODE_OPTIONS="--max-old-space-size=512" npm run build
            rm -rf node_modules
